name: Catalog legacy health aliases

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/catalog-health-alias-results
      VSTestTestCaseFilter: FullyQualifiedName~LegacyCatalogHealthHttpTests
    steps:
      - name: Check out CatalogService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 173d63218d9142b34075bca87f5c6d933bcbdfb6
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: fe17b8cea8ace3eef5434f8b29c9038f5c975613
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.CatalogService.Tests/Legacy.Maliev.CatalogService.Tests.csproj
          dotnet-version: '11.0.100'
          use-local-maliev-dependencies: 'true'
      - name: Verify exactly five actual health alias executions
        run: python3 -B scripts/verify-country-health-diagnostics.py catalog-health-alias-results --aliases
      - name: Verify synthetic alias enrollment rejection controls
        run: python3 -B scripts/test-catalog-health-alias-enrollment.py
      - name: Preserve original diagnostic reader controls
        run: python3 -B scripts/test-country-health-diagnostic-reader.py
      - name: Preserve health alias evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-health-aliases-${{ github.sha }}
          path: catalog-health-alias-results
          if-no-files-found: warn
          retention-days: 7
